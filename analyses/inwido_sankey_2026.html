<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inwido AB – Hur de tjänar pengar (RTM Q2 2026)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f7efe1;
    color: #1f2a22;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #143326;
    margin-bottom: 4px;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #143326;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .brand-mark {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: #4dbb7c;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    line-height: 1;
  }
  .subtitle {
    font-size: 0.78rem;
    color: #5f6b5d;
    margin-bottom: 28px;
    text-align: center;
  }
  #chart-wrap {
    width: 100%;
    max-width: 660px;
    position: relative;
  }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tooltip {
    position: absolute;
    background: #fffaf0;
    border: 1px solid rgba(20, 51, 38, 0.18);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: #1f2a22;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 200px;
    line-height: 1.55;
    z-index: 10;
  }
  .tooltip strong { font-size: 0.85rem; display: block; margin-bottom: 4px; }
  .tooltip .tip-val { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .tip-row { color: #8b949e; }
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 24px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: #536257;
    font-weight: 600;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }
  @media (max-width: 520px) {
    body {
      padding: 24px 10px;
      overflow-x: hidden;
    }
    .brand {
      align-self: flex-start;
      margin-left: 6px;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
    }
    .brand-mark {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      font-size: 0.66rem;
    }
    h1 {
      width: 100%;
      font-size: 0.96rem;
      line-height: 1.25;
      padding: 0 10px;
    }
    .subtitle {
      font-size: 0.68rem;
      margin-bottom: 18px;
    }
    #chart-wrap {
      max-width: none;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    svg {
      min-width: 620px;
    }
    .legend {
      width: 100%;
      justify-content: flex-start;
      gap: 12px;
      overflow-x: auto;
      padding: 0 6px 6px;
    }
    .legend-item {
      flex: 0 0 auto;
      font-size: 0.68rem;
    }
  }
</style>
</head>
<body>

<div class="brand"><span class="brand-mark">↗</span>Börsanalys.se</div>
<h1>Inwido AB – Hur de tjänar pengar</h1>
<p class="subtitle">RTM Q2 2026 · Omsättning 9 468 Mkr · EBIT-marginal 9,1 %</p>

<div id="chart-wrap">
  <svg id="sankey" viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="tooltip" id="tt"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1f8f4d"></div>Intäkt &amp; vinst</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c44236"></div>Kostnader</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1e3b8b"></div>Segment / geografi</div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────
const NODES = [
  { id:'ska',   label:'Skandinavien',  val:4355, col:0, color:'#1e3b8b', pct: '46,0 %',
    tips:['Största segmentet','4 355 Mkr · 46 % av intäkt','Stark position under Elitfönster'] },
  { id:'vas',   label:'Väst',          val:2083, col:0, color:'#2563eb', pct: '22,0 %',
    tips:['Väst (UK & Irland)','2 083 Mkr · 22 % av intäkt','Sidey-förvärvet bidrar positivt'] },
  { id:'ost',   label:'Öst',           val:1799, col:0, color:'#3b82f6', pct: '19,0 %',
    tips:['Öst (Finland)','1 799 Mkr · 19 % av intäkt','Tuffare finsk byggkonjunktur dämpar'] },
  { id:'eco',   label:'e-Commerce',    val:1041, col:0, color:'#60a5fa', pct: '11,0 %',
    tips:['Direkt online','1 041 Mkr · 11 % av intäkt','Direktförsäljning till konsument online'] },
  { id:'ovr',   label:'Övrigt',        val:190,  col:0, color:'#93c5fd', pct: '2,0 %',
    tips:['Övrigt & elim.','190 Mkr · 2 % av intäkt','Centrala poster och elimineringar'] },
  { id:'rev',   label:'Omsättning',    val:9468, col:1, color:'#1f8f4d', pct: '100,0 %',
    tips:['Nettoomsättning','9 468 Mkr','+16 % tillväxt per Q2 RTM'] },
  { id:'gross', label:'Bruttoresultat',val:2367, col:2, color:'#1f8f4d', pct: '25,0 %',
    tips:['Bruttoresultat','2 367 Mkr · marginal 25,0 %','Stabil bruttomarginal trots inflation'] },
  { id:'cogs',  label:'Varukostnad',   val:7101, col:2, color:'#c44236', pct: '75,0 %',
    tips:['Kostnad sålda varor','7 101 Mkr · 75,0 % av intäkt','Direkt material, fabrik och löner'] },
  { id:'ebit',  label:'EBIT',          val:862,  col:3, color:'#1f8f4d', pct: '9,1 %',
    tips:['Rörelseresultat','862 Mkr · marginal 9,1 %','Operationell EBITA uppgick till 970 Mkr'] },
  { id:'opex',  label:'Rörelsekostn.', val:1505, col:3, color:'#c44236', pct: '15,9 %',
    tips:['Opex & Avskrivn.','1 505 Mkr · 15,9 % av intäkt','Försäljning, administration och goodwillavskrivningar'] },
  { id:'net',   label:'Nettoresultat', val:528,  col:4, color:'#1f8f4d', pct: '5,6 %',
    tips:['Periodens vinst','528 Mkr · marginal 5,6 %','Motsvarar vinst per aktie på 9,11 kr'] },
  { id:'tax',   label:'Skatt',         val:334,  col:4, color:'#c44236', pct: '3,5 %',
    tips:['Skatt','334 Mkr','Inkomstskatt och finansiella poster'] },
];

const LINKS = [
  { s:'ska',   t:'rev',   v:4355, color:'#1e3b8b' },
  { s:'vas',   t:'rev',   v:2083, color:'#2563eb' },
  { s:'ost',   t:'rev',   v:1799, color:'#3b82f6' },
  { s:'eco',   t:'rev',   v:1041, color:'#60a5fa' },
  { s:'ovr',   t:'rev',   v:190,  color:'#93c5fd' },
  { s:'rev',   t:'gross', v:2367, color:'#1f8f4d' },
  { s:'rev',   t:'cogs',  v:7101, color:'#c44236' },
  { s:'gross', t:'ebit',  v:862,  color:'#1f8f4d' },
  { s:'gross', t:'opex',  v:1505, color:'#c44236' },
  { s:'ebit',  t:'net',   v:528,  color:'#1f8f4d' },
  { s:'ebit',  t:'tax',   v:334,  color:'#c44236' },
];

// ─── LAYOUT ─────────────────────────────────────────────────────────
const W = 620, H = 310;
const PAD_TOP = 28, PAD_BOT = 20;
const NODE_W = 12, GAP = 7;
const AVAIL_H = H - PAD_TOP - PAD_BOT;
const SCALE = AVAIL_H / 9468; // px per Mkr
const COL_X = [60, 165, 285, 400, 510];
const COLS = 5;

// Build node map
const nodeMap = {};
NODES.forEach(n => { nodeMap[n.id] = n; });

// Sort nodes within each column (income on top, cost below)
const colNodes = Array.from({length: COLS}, () => []);
NODES.forEach(n => colNodes[n.col].push(n));
colNodes.forEach(col => col.sort((a,b) => {
  if (a.color === '#c44236' && b.color !== '#c44236') return 1;
  if (a.color !== '#c44236' && b.color === '#c44236') return -1;
  return b.val - a.val;
}));

// Compute node y positions
colNodes.forEach(col => {
  const isCol4 = colNodes.indexOf(col) === 4;
  const colGap = isCol4 ? 40 : GAP;
  const totalH = col.reduce((s, n) => s + n.val * SCALE, 0)
               + (col.length - 1) * colGap;
  let y = PAD_TOP + (AVAIL_H - totalH) / 2;
  col.forEach(n => {
    n.y0 = y;
    n.y1 = y + n.val * SCALE;
    y = n.y1 + colGap;
  });
});

// Track slot offsets for ribbon stacking
NODES.forEach(n => { n._outOff = 0; n._inOff = 0; });

// ─── SVG BUILD ──────────────────────────────────────────────────────
const svg = document.getElementById('sankey');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  return e;
}

function formatLabelVal(value) {
  return Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Mkr";
}

function addLabelPlate(x, y, width, height) {
  const plate = el('rect', {
    x: x - width / 2,
    y: y - height / 2,
    width,
    height,
    rx: 4,
    fill: 'rgba(255,255,250,0.92)',
    stroke: 'rgba(20,51,38,0.1)',
    'stroke-width': 0.6,
    style: 'pointer-events:none;'
  });
  svg.appendChild(plate);
  return plate;
}

// Ribbons (behind nodes)
const ribbonGroup = el('g', {});
svg.appendChild(ribbonGroup);

const allRibbons = [];

LINKS.forEach((lk, li) => {
  const src = nodeMap[lk.s];
  const tgt = nodeMap[lk.t];
  const h   = lk.v * SCALE;

  const x0 = COL_X[src.col] + (['rev', 'gross', 'ebit', 'net'].includes(src.id) ? NODE_W * 1.45 : NODE_W);
  const x1 = COL_X[tgt.col];

  const y0 = src.y0 + src._outOff + h / 2;
  const y1 = tgt.y0 + tgt._inOff + h / 2;

  src._outOff += h;
  tgt._inOff  += h;

  const mx = (x0 + x1) / 2;
  const d  = `M ${x0},${y0} C ${mx},${y0} ${mx},${y1} ${x1},${y1}`;

  const path = el('path', {
    d,
    fill: 'none',
    stroke: lk.color,
    'stroke-width': Math.max(3, h),
    'stroke-linecap': 'butt',
    opacity: '0.42',
    'data-li': li,
    style: 'cursor:default; transition: opacity 0.18s, stroke-width 0.18s; mix-blend-mode:multiply;'
  });
  ribbonGroup.appendChild(path);
  allRibbons.push(path);
});

// Nodes + labels
const nodeElems = {};
NODES.forEach(n => {
  const isMainNode = ['rev', 'gross', 'ebit', 'net'].includes(n.id);
  const nodeW = isMainNode ? NODE_W * 1.45 : NODE_W;
  const rectX = COL_X[n.col] - (nodeW - NODE_W) / 2;

  const rect = el('rect', {
    x: rectX,
    y: n.y0,
    width: nodeW,
    height: n.val * SCALE,
    rx: 3,
    fill: n.color,
    style: 'cursor:pointer; transition: opacity 0.18s;'
  });
  svg.appendChild(rect);
  nodeElems[n.id] = rect;

  // Label
  const isLeft  = n.col === 0;
  const isRight = n.col === COLS - 1;
  const lx = isLeft  ? COL_X[n.col] - 8
           : isRight ? COL_X[n.col] + nodeW + 8
           : COL_X[n.col] + NODE_W / 2;
  const anchor = isLeft ? 'end' : isRight ? 'start' : 'middle';
  const ly = (n.y0 + n.y1) / 2;

  // For middle columns, put label above/below
  if (!isLeft && !isRight) {
    const isCost = n.color === '#c44236';
    const above = !isCost;
    const offset = (n.val * SCALE) < 26 ? (above ? -16 : 16) : 0;
    const labelY = ly + offset;
    const plateWidth = Math.max(76, n.label.length * 6.2);
    addLabelPlate(lx, labelY + 6, plateWidth, 34);

    const txt = el('text', {
      x: lx, y: labelY - 4,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: '#1f2a22',
      'font-size': '9',
      'font-weight': '700',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    txt.textContent = n.label;
    svg.appendChild(txt);

    const val = el('text', {
      x: lx, y: labelY + 6,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: n.color,
      'font-size': '9',
      'font-weight': '800',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    val.textContent = formatLabelVal(n.val);
    svg.appendChild(val);

    const pctTxt = el('text', {
      x: lx, y: labelY + 16,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: '#536257',
      'font-size': '8',
      'font-weight': '600',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    pctTxt.textContent = n.pct;
    svg.appendChild(pctTxt);
  } else {
    // Columns 0 (left) and 4 (right)
    const txt = el('text', {
      x: lx, y: ly - 10,
      'text-anchor': anchor,
      'dominant-baseline': 'middle',
      fill: '#25342a',
      'font-size': '10',
      'font-weight': '700',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    txt.textContent = n.label;
    svg.appendChild(txt);

    const val = el('text', {
      x: lx, y: ly + 1,
      'text-anchor': anchor,
      'dominant-baseline': 'middle',
      fill: n.color,
      'font-size': '9',
      'font-weight': '800',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    val.textContent = formatLabelVal(n.val);
    svg.appendChild(val);

    const pctTxt = el('text', {
      x: lx, y: ly + 11,
      'text-anchor': anchor,
      'dominant-baseline': 'middle',
      fill: '#536257',
      'font-size': '8',
      'font-weight': '600',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    pctTxt.textContent = n.pct;
    svg.appendChild(pctTxt);
  }
});

// Column headers (very light, small)
const headers = ['Segment','Omsättning','Brutto','EBIT','Netto'];
headers.forEach((h, i) => {
  const txt = el('text', {
    x: COL_X[i] + NODE_W / 2,
    y: 10,
    'text-anchor': 'middle',
    fill: '#9ba08c',
    'font-size': '8',
    'font-weight': '600',
    'font-family': '-apple-system,sans-serif',
    'letter-spacing': '0.06em',
    style: 'text-transform:uppercase; user-select:none;'
  });
  txt.textContent = h.toUpperCase();
  svg.appendChild(txt);
});

// ─── INTERACTION ────────────────────────────────────────────────────
const tt = document.getElementById('tt');
const wrap = document.getElementById('chart-wrap');

// Map node id to connected link indices
const nodeLinks = {};
NODES.forEach(n => { nodeLinks[n.id] = []; });
LINKS.forEach((lk, li) => {
  nodeLinks[lk.s].push(li);
  nodeLinks[lk.t].push(li);
});

function highlight(nid) {
  const active = nodeLinks[nid];
  allRibbons.forEach((r, i) => {
    r.setAttribute('opacity', active.includes(i) ? '0.72' : '0.12');
  });
  Object.entries(nodeElems).forEach(([id, r]) => {
    r.setAttribute('opacity', id === nid ? '1' : '0.35');
  });
}

function reset() {
  allRibbons.forEach(r => r.setAttribute('opacity', '0.42'));
  Object.values(nodeElems).forEach(r => r.setAttribute('opacity', '1'));
  tt.style.opacity = '0';
}

NODES.forEach(n => {
  const rect = nodeElems[n.id];
  rect.addEventListener('mouseenter', (e) => {
    highlight(n.id);
    const b = wrap.getBoundingClientRect();
    const rx = e.clientX - b.left;
    const ry = e.clientY - b.top;
    const left = rx > b.width / 2 ? rx - 210 : rx + 16;
    tt.style.left = left + 'px';
    tt.style.top  = (ry - 40) + 'px';
    tt.innerHTML = `<strong>${n.tips[0]}</strong><div class="tip-val" style="color:${n.color}">${n.tips[1]}</div><div class="tip-row">${n.tips[2]}</div>`;
    tt.style.opacity = '1';
  });
  rect.addEventListener('mouseleave', reset);
});

// ─── FADE-IN ANIMATION ──────────────────────────────────────────────
allRibbons.forEach((r, i) => {
  r.style.opacity = '0';
  setTimeout(() => {
    r.style.transition = 'opacity 0.5s';
    r.style.opacity = '0.42';
  }, 100 + i * 60);
});
</script>
</body>
</html>

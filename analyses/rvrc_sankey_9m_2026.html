<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevolutionRace – Resultaträkning 9 månader 2025/26</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f7efe1;
    color: #1f2a22;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #143326;
    margin-bottom: 4px;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #143326;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .brand-mark {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: #4dbb7c;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    line-height: 1;
  }
  .subtitle {
    font-size: 0.78rem;
    color: #5f6b5d;
    margin-bottom: 28px;
    text-align: center;
  }
  #chart-wrap {
    width: 100%;
    max-width: 760px;
    position: relative;
  }
  svg { width: 100%; height: auto; display: block; }
  .tooltip {
    position: absolute;
    background: #fffaf0;
    border: 1px solid rgba(20, 51, 38, 0.18);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: #1f2a22;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 220px;
    line-height: 1.55;
    z-index: 10;
  }
  .tooltip strong { font-size: 0.85rem; display: block; margin-bottom: 4px; }
  .tooltip .tip-val { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .tip-row { color: #8b949e; }
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: #536257;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }
  @media (max-width: 520px) {
    body {
      padding: 24px 10px;
      overflow-x: hidden;
    }
    .brand {
      align-self: flex-start;
      margin-left: 6px;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
    }
    .brand-mark {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      font-size: 0.66rem;
    }
    h1 {
      width: 100%;
      font-size: 0.96rem;
      line-height: 1.25;
      padding: 0 10px;
    }
    .subtitle {
      font-size: 0.68rem;
      margin-bottom: 18px;
    }
    #chart-wrap {
      max-width: none;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    svg {
      min-width: 760px;
    }
    .legend {
      width: 100%;
      justify-content: flex-start;
      gap: 12px;
      overflow-x: auto;
      padding: 0 6px 6px;
      flex-wrap: nowrap;
    }
    .legend-item {
      flex: 0 0 auto;
      font-size: 0.68rem;
    }
  }
</style>
</head>
<body>

<div class="brand"><span class="brand-mark">↗</span>Börsanalys.se</div>
<h1>RevolutionRace – Resultaträkning 9 månader 2025/26</h1>
<p class="subtitle">Juli 2025–mars 2026 · Omsättning 1 604 MSEK · Justerad EBIT 359 MSEK</p>

<div id="chart-wrap">
  <svg id="sankey" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="tooltip" id="tt"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1f8f4d"></div>Intäkt / Vinst</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c44236"></div>Kostnad</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b46b22"></div>Övriga marknader</div>
</div>

<script>
const NODES = [
  { id:'dach', label:'DACH', val:936, col:0, color:'#1f8f4d',
    tips:['DACH','936 MSEK · 58 % av omsättning','Största regionen och viktigaste tillväxtmotorn'] },
  { id:'nordics', label:'Norden', val:370, col:0, color:'#17763e',
    tips:['Norden','370 MSEK · 23 % av omsättning','Stabil hemmaregion med hög varumärkeskännedom'] },
  { id:'row', label:'Övriga världen', val:298, col:0, color:'#b46b22',
    tips:['Övriga världen','298 MSEK · 19 % av omsättning','Inkluderar bland annat Nordamerika och övriga marknader'] },
  { id:'revenue', label:'Nettoomsättning', val:1604, col:1, color:'#1f8f4d',
    tips:['Nettoomsättning 9 månader 2025/26','1 604 MSEK','+6 % i SEK och +10 % i lokal valuta'] },
  { id:'gross_profit', label:'Bruttoresultat', val:1124, col:2, color:'#1f8f4d',
    tips:['Bruttoresultat','1 124 MSEK · 70,1 % bruttomarginal','Hög marginal tack vare D2C-modell och valutamedvind'] },
  { id:'cogs', label:'Kostnad sålda varor', val:480, col:2, color:'#c44236',
    tips:['Kostnad sålda varor','480 MSEK · 29,9 % av omsättning','Varukostnad efter bruttomarginal'] },
  { id:'adjusted_ebit', label:'Justerad EBIT', val:359, col:3, color:'#1f8f4d',
    tips:['Justerad EBIT','359 MSEK · 22,4 % marginal','Underliggande rörelseresultat före jämförelsestörande poster'] },
  { id:'opex', label:'Rörelsekostn.', val:765, col:3, color:'#c44236',
    tips:['Rörelsekostnader efter bruttoresultat','765 MSEK · 47,7 % av omsättning','Marknadsföring, personal och övriga rörelsekostnader'] },
  { id:'reported_ebit', label:'Rapporterad EBIT', val:357, col:4, color:'#1f8f4d',
    tips:['Rapporterad EBIT','357 MSEK · 22,2 % marginal','Efter jämförelsestörande poster'] },
  { id:'items_affecting_comparability', label:'Jämf.störande', val:2, col:4, color:'#c44236',
    tips:['Jämförelsestörande poster','2 MSEK · negativ effekt','Brygga mellan justerad och rapporterad EBIT'] },
  { id:'ebt', label:'Resultat före skatt', val:356, col:5, color:'#1f8f4d',
    tips:['Resultat före skatt','356 MSEK · 22,2 % av omsättning','Rapporterad EBIT justerat för finansiella poster'] },
  { id:'financial_items', label:'Finansiella poster', val:1, col:5, color:'#c44236',
    tips:['Finansiella poster','1 MSEK','Brygga från EBIT till EBT'] },
  { id:'net_profit', label:'Nettoresultat', val:281, col:6, color:'#1f8f4d',
    tips:['Nettoresultat','281 MSEK · 17,5 % nettomarginal','Periodens resultat efter skatt'] },
  { id:'tax', label:'Skatt', val:75, col:6, color:'#c44236',
    tips:['Skatt','75 MSEK · effektiv skatt cirka 21 %','Skattekostnad för perioden'] },
];

const LINKS = [
  { s:'dach', t:'revenue', v:936, color:'#1f8f4d' },
  { s:'nordics', t:'revenue', v:370, color:'#17763e' },
  { s:'row', t:'revenue', v:298, color:'#b46b22' },
  { s:'revenue', t:'gross_profit', v:1124, color:'#1f8f4d' },
  { s:'revenue', t:'cogs', v:480, color:'#c44236' },
  { s:'gross_profit', t:'adjusted_ebit', v:359, color:'#1f8f4d' },
  { s:'gross_profit', t:'opex', v:765, color:'#c44236' },
  { s:'adjusted_ebit', t:'reported_ebit', v:357, color:'#1f8f4d' },
  { s:'adjusted_ebit', t:'items_affecting_comparability', v:2, color:'#c44236' },
  { s:'reported_ebit', t:'ebt', v:356, color:'#1f8f4d' },
  { s:'reported_ebit', t:'financial_items', v:1, color:'#c44236' },
  { s:'ebt', t:'net_profit', v:281, color:'#1f8f4d' },
  { s:'ebt', t:'tax', v:75, color:'#c44236' },
];

const W = 760, H = 360;
const PAD_TOP = 28, PAD_BOT = 32;
const NODE_W = 13, GAP = 8;
const AVAIL_H = H - PAD_TOP - PAD_BOT;
const SCALE = AVAIL_H / 1604;
const COL_X = [52, 168, 290, 410, 512, 602, 690];
const COLS = 7;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.id] = n; });

const colNodes = Array.from({length: COLS}, () => []);
NODES.forEach(n => colNodes[n.col].push(n));
colNodes.forEach(col => col.sort((a,b) => {
  if (a.color === '#c44236' && b.color !== '#c44236') return 1;
  if (a.color !== '#c44236' && b.color === '#c44236') return -1;
  return b.val - a.val;
}));

colNodes.forEach(col => {
  const totalH = col.reduce((s, n) => s + Math.max(3, n.val * SCALE), 0)
               + (col.length - 1) * GAP;
  let y = PAD_TOP + (AVAIL_H - totalH) / 2;
  col.forEach(n => {
    const h = Math.max(3, n.val * SCALE);
    n.y0 = y;
    n.y1 = y + h;
    y = n.y1 + GAP;
  });
});

NODES.forEach(n => { n._outOff = 0; n._inOff = 0; });

const svg = document.getElementById('sankey');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  return e;
}

function addLabelPlate(x, y, width, height) {
  const plate = el('rect', {
    x: x - width / 2,
    y: y - height / 2,
    width,
    height,
    rx: 4,
    fill: 'rgba(255,250,240,0.9)',
    stroke: 'rgba(20,51,38,0.12)',
    'stroke-width': 0.6,
    style: 'pointer-events:none;'
  });
  svg.appendChild(plate);
}

for (let i = 0; i < COLS - 1; i++) {
  const x = COL_X[i] + NODE_W / 2;
  const line = el('line', {
    x1: x, y1: PAD_TOP - 10,
    x2: x, y2: H - PAD_BOT + 10,
    stroke: 'rgba(20,51,38,0.13)', 'stroke-width': 1
  });
  svg.appendChild(line);
}

const ribbonGroup = el('g', {});
svg.appendChild(ribbonGroup);
const allRibbons = [];

LINKS.forEach((lk, li) => {
  const src = nodeMap[lk.s];
  const tgt = nodeMap[lk.t];
  const h = Math.max(3, lk.v * SCALE);
  const x0 = COL_X[src.col] + NODE_W;
  const x1 = COL_X[tgt.col];
  const y0 = src.y0 + src._outOff + h / 2;
  const y1 = tgt.y0 + tgt._inOff + h / 2;

  src._outOff += h;
  tgt._inOff += h;

  const mx = (x0 + x1) / 2;
  const d = `M ${x0},${y0} C ${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  const path = el('path', {
    d,
    fill: 'none',
    stroke: lk.color,
    'stroke-width': h,
    'stroke-linecap': 'butt',
    opacity: '0.42',
    'data-li': li,
    style: 'cursor:default; transition: opacity 0.18s, stroke-width 0.18s; mix-blend-mode:multiply;'
  });
  ribbonGroup.appendChild(path);
  allRibbons.push(path);
});

const nodeElems = {};
NODES.forEach(n => {
  const h = Math.max(3, n.val * SCALE);
  const rect = el('rect', {
    x: COL_X[n.col],
    y: n.y0,
    width: NODE_W,
    height: h,
    rx: 3,
    fill: n.color,
    style: 'cursor:pointer; transition: opacity 0.18s;'
  });
  svg.appendChild(rect);
  nodeElems[n.id] = rect;

  const isLeft = n.col === 0;
  const isRight = n.col === COLS - 1;
  const lx = isLeft ? COL_X[n.col] - 6
           : isRight ? COL_X[n.col] + NODE_W + 6
           : COL_X[n.col] + NODE_W / 2;
  const anchor = isLeft ? 'end' : isRight ? 'start' : 'middle';
  const ly = (n.y0 + n.y1) / 2;

  if (!isLeft && !isRight) {
    const isCost = n.color === '#c44236';
    const labelY = ly + (isCost ? 14 : -14);
    const plateWidth = Math.max(58, Math.min(92, n.label.length * 5.6));
    addLabelPlate(lx, labelY + 6, plateWidth, 28);
    const txt = el('text', {
      x: lx, y: labelY,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: '#1f2a22',
      'font-size': '9',
      'font-weight': '700',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    txt.textContent = n.label;
    svg.appendChild(txt);

    const val = el('text', {
      x: lx, y: labelY + 12,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: n.color,
      'font-size': '9',
      'font-weight': '800',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    val.textContent = n.val + ' M';
    svg.appendChild(val);
  } else {
    const txt = el('text', {
      x: lx, y: ly - 5,
      'text-anchor': anchor,
      'dominant-baseline': 'middle',
      fill: '#25342a',
      'font-size': '10',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    txt.textContent = n.label;
    svg.appendChild(txt);

    const val = el('text', {
      x: lx, y: ly + 9,
      'text-anchor': anchor,
      'dominant-baseline': 'middle',
      fill: n.color,
      'font-size': '9',
      'font-weight': '700',
      'font-family': '-apple-system,sans-serif',
      style: 'pointer-events:none; user-select:none;'
    });
    val.textContent = n.val + ' MSEK';
    svg.appendChild(val);
  }
});

const headers = ['Geografi','Omsättning','Brutto','Justerad EBIT','Rapporterad','EBT','Netto'];
headers.forEach((h, i) => {
  const txt = el('text', {
    x: COL_X[i] + NODE_W / 2,
    y: 14,
    'text-anchor': 'middle',
    fill: '#6d705e',
    'font-size': '8',
    'font-family': '-apple-system,sans-serif',
    'letter-spacing': '0.05em',
    style: 'text-transform:uppercase; user-select:none;'
  });
  txt.textContent = h.toUpperCase();
  svg.appendChild(txt);
});

const tt = document.getElementById('tt');
const wrap = document.getElementById('chart-wrap');
const nodeLinks = {};
NODES.forEach(n => { nodeLinks[n.id] = []; });
LINKS.forEach((lk, li) => {
  nodeLinks[lk.s].push(li);
  nodeLinks[lk.t].push(li);
});

function highlight(nid) {
  const active = nodeLinks[nid];
  allRibbons.forEach((r, i) => {
    r.setAttribute('opacity', active.includes(i) ? '0.72' : '0.16');
  });
  Object.entries(nodeElems).forEach(([id, r]) => {
    r.setAttribute('opacity', id === nid ? '1' : '0.4');
  });
}

function reset() {
  allRibbons.forEach(r => r.setAttribute('opacity', '0.42'));
  Object.values(nodeElems).forEach(r => r.setAttribute('opacity', '1'));
  tt.style.opacity = '0';
}

NODES.forEach(n => {
  const rect = nodeElems[n.id];
  rect.addEventListener('mouseenter', (e) => {
    highlight(n.id);
    const b = wrap.getBoundingClientRect();
    const rx = e.clientX - b.left;
    const ry = e.clientY - b.top;
    const left = rx > b.width / 2 ? rx - 230 : rx + 16;
    tt.style.left = left + 'px';
    tt.style.top = (ry - 40) + 'px';
    tt.innerHTML = `<strong>${n.tips[0]}</strong><div class="tip-val" style="color:${n.color}">${n.tips[1]}</div><div class="tip-row">${n.tips[2]}</div>`;
    tt.style.opacity = '1';
  });
  rect.addEventListener('mouseleave', reset);
});

allRibbons.forEach((r, i) => {
  r.style.opacity = '0';
  setTimeout(() => {
    r.style.transition = 'opacity 0.5s';
    r.style.opacity = '0.42';
  }, 100 + i * 45);
});
</script>
</body>
</html>
